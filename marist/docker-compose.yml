services:
  db:
    image: mysql:8.0
    container_name: marist-mysql
    restart: always
    environment:
      MYSQL_DATABASE: marist
      MYSQL_USER: marist_user
      # Same password as MARIST_DB_PASSWORD in infra/.env — marist-backend
      # connects with it. Different variable name because Compose reads a
      # separate .env per stack directory; keep the two values in sync.
      MYSQL_PASSWORD: ${MYSQL_PW:?set MYSQL_PW in marist/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PW:?set MYSQL_ROOT_PW in marist/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
